<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PC방에서 GOAT까지 · 롤 선수 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f5;--panel:#ffffff;--panel2:#e4e9f0;--ink:#0f1b2d;--mute:#5d6b80;
  --gold:#8f6c1c;--gold2:#b98a25;--teal:#0a7c86;--red:#b3322e;--green:#26784a;--amber:#b87410;
  --line:#cfd7e2;--bar:#dbe2ec;--ovl:rgba(10,18,32,.55);
  --disp:'Black Han Sans','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --pix:'Press Start 2P','Black Han Sans',monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#060d18;--panel:#0d1a2d;--panel2:#13243b;--ink:#ece4d0;--mute:#8d9bb0;
    --gold:#c8aa6e;--gold2:#f0d28a;--teal:#2fd0c4;--red:#ff7268;--green:#62d68f;--amber:#f0b24a;
    --line:#26405f;--bar:#17283f;--ovl:rgba(0,4,12,.72);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#060d18;--panel:#0d1a2d;--panel2:#13243b;--ink:#ece4d0;--mute:#8d9bb0;
  --gold:#c8aa6e;--gold2:#f0d28a;--teal:#2fd0c4;--red:#ff7268;--green:#62d68f;--amber:#f0b24a;
  --line:#26405f;--bar:#17283f;--ovl:rgba(0,4,12,.72);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit}
svg{shape-rendering:crispEdges}
.wrap{max-width:520px;margin:0 auto;padding:52px 14px 40px}
.disp{font-family:var(--disp);font-weight:400;letter-spacing:-.01em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.card.gold{border-color:var(--gold)}
.mute{color:var(--mute)}
.sm{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--gold)}
.btn:focus-visible,.chipb:focus-visible,input:focus-visible,summary:focus-visible,.ct:focus-visible,.rc:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.btn b{display:block;font-weight:700}
.btn small{display:block;color:var(--mute);font-size:12px;line-height:1.35;margin-top:1px}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#fff;text-align:center;font-weight:700;font-size:15px}
:root[data-theme="dark"] .btn.pri{color:#0a1424}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#0a1424}}
.btn.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.btn.rec{border-color:var(--teal)}
.btn.ghost{background:transparent;text-align:center;color:var(--mute)}
.btn[disabled]{opacity:.45;cursor:default}
.chipb{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:34px}
.chipb.sel{background:var(--gold);color:#fff;border-color:var(--gold)}
:root[data-theme="dark"] .chipb.sel{color:#0a1424}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chipb.sel{color:#0a1424}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.tag.g{border-color:var(--gold);color:var(--gold)}
.tag.t{border-color:var(--teal);color:var(--teal)}
.bar{height:7px;background:var(--bar);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.bar.f i{background:var(--green)}
.bar.f.mid i{background:var(--amber)}
.bar.f.hi i{background:var(--red)}
.srow{display:grid;grid-template-columns:62px 1fr 44px;gap:8px;align-items:center;margin:6px 0;font-size:13.5px}
.srow .v{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--green);font-size:11.5px}.dn{color:var(--red);font-size:11.5px}
input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:16px;font-family:inherit}
h1,h2,h3{margin:0}
.big{font-family:var(--pix);font-size:26px;line-height:1.1;color:var(--gold)}
.ov{position:fixed;inset:0;background:var(--ovl);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--gold);border-bottom:none;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h3{font-family:var(--disp);font-weight:400;font-size:21px;margin-bottom:6px}
.sheet .body{margin-bottom:12px}
.sheet .body p{margin:0 0 6px}
.sheet .btn{margin-top:7px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ln:last-child{border-bottom:none}
.ln b{font-variant-numeric:tabular-nums}
.ruler{position:relative;height:44px;margin:14px 6px 6px}
.ruler .ln0{position:absolute;left:0;right:0;top:12px;height:3px;background:var(--line)}
.ruler .m{position:absolute;top:5px;transform:translateX(-50%);text-align:center;font-size:11px;color:var(--mute);white-space:nowrap}
.ruler .m::before{content:"";display:block;width:2px;height:16px;background:var(--gold);margin:0 auto 2px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#toast.on{opacity:1}
#setbtn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:25;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink);min-height:34px}
#setov{display:none;position:fixed;inset:0;z-index:50;background:var(--ovl);overflow:auto}
details summary{cursor:pointer;color:var(--mute);font-size:13px;padding:4px 0}
.rc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);cursor:pointer;text-align:left;width:100%;margin-bottom:6px}
.rc.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.rc b{font-size:15px}
.scene{display:block;width:100%;height:auto;border:2px solid var(--gold);background:#05070f;image-rendering:pixelated;margin-bottom:10px}
.face{display:block;width:64px;height:64px;border:2px solid var(--gold);background:var(--panel2);flex:none;image-rendering:pixelated}
.face.lg{width:112px;height:112px}
.fe{display:grid;grid-template-columns:70px 1fr;gap:6px 10px;align-items:center;font-size:13px}
.fe .ctl{display:flex;align-items:center;justify-content:space-between;gap:6px}
.fe .ctl button{border:1px solid var(--line);background:var(--panel);border-radius:6px;min-width:44px;min-height:34px;cursor:pointer}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.ct{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 1px 2px;text-align:center;cursor:pointer;font-size:10px;line-height:1.2;min-height:58px;overflow:hidden}
.ct.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.ct.off{opacity:.28;pointer-events:none}
.ct svg{width:32px;height:32px;display:block;margin:0 auto 2px;border:1px solid var(--line);image-rendering:pixelated}
.ct i{position:absolute;top:2px;right:4px;font-style:normal;font-size:10px;font-weight:700}
.ct em{display:block;font-style:normal;color:var(--mute);font-size:10px}
.tS{color:var(--gold)}.tA{color:var(--teal)}.tB{color:var(--mute)}.tC{color:var(--mute);opacity:.7}
.dcol{flex:1;min-width:0}
.slot{display:flex;align-items:center;gap:6px;height:30px;font-size:12px;white-space:nowrap;overflow:hidden}
.slot svg{width:26px;height:26px;border:1px solid var(--line);flex:none;image-rendering:pixelated}
.slot.empty svg{opacity:.25}
.ct img{width:32px;height:32px;display:block;margin:0 auto 2px;border:1px solid var(--line)}
.slot img{width:26px;height:26px;border:1px solid var(--line);flex:none}
.bans img{width:20px;height:20px;border:1px solid var(--line);filter:grayscale(1) brightness(.75)}
.stand{display:grid;grid-template-columns:28px 1fr 44px;gap:4px 8px;font-size:13px;margin:6px 0}
.stand .us{color:var(--gold);font-weight:700}
.bans{display:flex;gap:3px;margin:4px 0 6px}
.bans svg{width:20px;height:20px;border:1px solid var(--line);filter:grayscale(1) brightness(.75);image-rendering:pixelated}
.goldbar{display:flex;justify-content:space-between;font-size:12.5px;margin:4px 0 8px}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<button id="setbtn" aria-label="설정" onclick="openSettings()">⚙️ 설정</button>
<div id="setov"></div>
<script>
'use strict';
/* ============ 데이터 ============ */
var STATS=['mech','lane','macro','fight','mental','pool'];
var SL={mech:'피지컬',lane:'라인전',macro:'운영',fight:'한타',mental:'멘탈',pool:'챔프폭'};
var ROLES={
  top:{n:'탑',w:{lane:.26,mech:.16,macro:.14,fight:.18,mental:.14,pool:.12}},
  jg:{n:'정글',w:{macro:.26,fight:.20,mental:.16,mech:.14,lane:.08,pool:.16}},
  mid:{n:'미드',w:{lane:.22,mech:.20,macro:.18,fight:.14,mental:.14,pool:.12}},

};
var RK=['top','jg','mid','adc','sup'];
var ROLE_ORDER=RK;
var SUBS={mech:[['cs','CS·라스트히트'],['dodge','스킬 회피']],lane:[['trade','트레이드'],['wave','웨이브 관리']],macro:[['vision','시야·맵 리딩'],['obj','오브젝트 판단']],fight:[['pos','한타 포지셔닝'],['init','이니시·진입']],mental:[['tilt','멘탈 회복'],['clutch','큰 경기 집중']],pool:[['comf','시그니처 숙련'],['flex','신규 챔프 적응']]};
var KSUB={lane:['trade','wave'],gank:['dodge','vision'],grubs:['obj','vision'],dragon:['obj','vision'],soul:['obj','vision'],herald:['obj','vision'],baron:['obj','vision'],elder:['obj','vision'],fight:['pos','init'],siege:['wave','obj'],split:['wave','vision'],comm:['tilt','clutch']};
var RL={top:'탑',jg:'정글',mid:'미드',adc:'원딜',sup:'서폿'};
var TRAITS={

  carry:['캐리 본능','이벤트 이득·손실 20% 증폭'],
  fight:['한타 지배자','한타 선택지 성공률 +6%'],
  steady:['꾸준함','노화로 인한 하락 30% 감소']
};
var TRK=Object.keys(TRAITS);
function mk(m,l,ma,f,me,p){return {mech:m,lane:l,macro:ma,fight:f,mental:me,pool:p};}
var REAL=[
 {id:'페이커',role:'mid',pot:1.35,ar:.5,tr:'clutch',sig:['아지르','오리아나','르블랑','신드라','사일러스'],b:mk(9,8,12,8,14,14),d:'불멸의 미드 · 운영·멘탈·챔프폭이 압도적'},
 {id:'쵸비',role:'mid',pot:1.28,ar:1,tr:'laneking',sig:['아지르','요네','빅토르','아칼리','오리아나'],b:mk(9,14,9,7,8,8),d:'라인전 괴물 · 초반부터 격차를 벌린다'},
 {id:'쇼메이커',role:'mid',pot:1.22,ar:1,tr:'fight',sig:['오리아나','아지르','신드라','코르키'],b:mk(8,8,10,10,9,8),d:'교전 설계의 장인'},
 {id:'비디디',role:'mid',pot:1.15,ar:1,tr:'steady',sig:['오리아나','사일러스','코르키','아리'],b:mk(7,7,7,7,7,8),d:'흔들림 없는 꾸준함'},
 {id:'제우스',role:'top',pot:1.3,ar:1,tr:'carry',sig:['오른','크산테','아트록스','잭스','그웬'],b:mk(11,11,6,9,7,6),d:'탑 에이스 · 피지컬 괴물'},
 {id:'기인',role:'top',pot:1.2,ar:1,tr:'pool',sig:['나르','케넨','레넥톤','잭스'],b:mk(6,9,8,9,8,12),d:'챔프폭이 넓은 만능 탑'},
 {id:'도란',role:'top',pot:1.15,ar:1,tr:'iron',sig:['잭스','크산테','레넥톤','오른'],b:mk(6,8,8,9,10,6),d:'팀을 위해 궂은일을 해내는 탑'},
 {id:'더샤이',role:'top',pot:1.25,ar:1,tr:'carry',sig:['잭스','카밀','피오라','제이스'],b:mk(12,13,2,9,3,6),d:'공격적인 슈퍼 캐리 탑 (멘탈은 롤러코스터)'},
 {id:'오너',role:'jg',pot:1.28,ar:1,tr:'shotcall',sig:['리 신','비에고','자르반 4세','세주아니','헤카림'],b:mk(8,4,12,11,9,9),d:'동선과 교전 판단이 교과서인 정글러'},
 {id:'캐니언',role:'jg',pot:1.3,ar:1,tr:'fight',sig:['니달리','그레이브즈','리 신','킨드레드','엘리스'],b:mk(10,5,10,12,7,9),d:'공격적인 동선의 정글 에이스'},
 {id:'피넛',role:'jg',pot:1.2,ar:.8,tr:'shotcall',sig:['리 신','엘리스','렉사이','비에고'],b:mk(7,4,12,9,10,8),d:'운영형 정글의 베테랑'},
 {id:'카나비',role:'jg',pot:1.18,ar:1,tr:'carry',sig:['리 신','자르반 4세','킨드레드','헤카림'],b:mk(9,5,8,10,6,8),d:'폭발적인 갱킹 타이밍'},
 {id:'구마유시',role:'adc',pot:1.28,ar:1,tr:'steady',sig:['징크스','칼리스타','자야','제리','이즈리얼'],b:mk(11,9,6,11,9,7),d:'정상급 에이스 원딜'},
 {id:'룰러',role:'adc',pot:1.28,ar:1,tr:'clutch',sig:['제리','아펠리오스','이즈리얼','카이사'],b:mk(10,8,7,12,10,7),d:'한타 포지셔닝의 정석'},
 {id:'페이즈',role:'adc',pot:1.2,ar:1,tr:'carry',sig:['이즈리얼','징크스','시비르','칼리스타'],b:mk(10,8,5,10,7,6),d:'날카로운 캐리력'},
 {id:'데프트',role:'adc',pot:1.25,ar:.6,tr:'iron',sig:['징크스','자야','아펠리오스','진'],b:mk(9,9,7,10,12,9),d:'오랫동안 정상을 지키는 원딜'},
 {id:'바이퍼',role:'adc',pot:1.22,ar:1,tr:'steady',sig:['징크스','카이사','이즈리얼','아펠리오스'],b:mk(11,8,6,11,8,7),d:'안정감 있는 하드 캐리'},
 {id:'테디',role:'adc',pot:1.2,ar:1,tr:'laneking',sig:['징크스','칼리스타','루시안','진'],b:mk(10,10,5,9,8,6),d:'라인전이 강한 원딜'},
 {id:'우지',role:'adc',pot:1.25,ar:1,tr:'carry',sig:['이즈리얼','징크스','카이사','루시안'],b:mk(13,10,3,11,5,6),d:'폭발적인 피지컬의 원딜 슈퍼스타'},
 {id:'케리아',role:'sup',pot:1.3,ar:1,tr:'pool',sig:['알리스타','나미','쓰레쉬','렐','브라움'],b:mk(8,10,9,11,8,12),d:'창의적인 서포터 · 라인전과 챔프폭'},
 {id:'리헨즈',role:'sup',pot:1.18,ar:1,tr:'shotcall',sig:['룰루','라칸','탐 켄치','쓰레쉬'],b:mk(5,7,11,9,10,8),d:'노련한 시야·운영형 서포터'},
 {id:'베릴',role:'sup',pot:1.18,ar:1,tr:'pool',sig:['잔나','나미','블리츠크랭크','룰루'],b:mk(6,8,9,9,9,10),d:'다재다능한 서포터'},
 {id:'마타',role:'sup',pot:1.12,ar:.9,tr:'shotcall',sig:['쓰레쉬','블리츠크랭크','알리스타','카르마'],b:mk(5,6,12,9,10,8),d:'운영과 콜이 강점인 베테랑'},
 {id:'코어장전',role:'sup',pot:1.15,ar:.9,tr:'iron',sig:['쓰레쉬','잔나','레오나','노틸러스'],b:mk(6,7,10,10,9,9),d:'안정적인 한타 서포터'}
];
/* 챔피언: 이름, 포지션, 피해유형, 태그(E이니시 P포킹 K픽 S후반 R초반 T탱), 기본 전력 */

function buff(rg){return G&&rg===G.meta?3:0;}
function pgame(a,b){return 1/(1+Math.pow(10,-(a-b)/DIV));}
function comb(n,k){var r=1;for(var i=1;i<=k;i++)r=r*(n-k+i)/i;return r;}
function seriesP(p,n){var need=(n+1)/2,s=0;for(var k=0;k<need;k++){s+=comb(need-1+k,k)*Math.pow(p,need)*Math.pow(1-p,k);}return s;}
function ourPerf(){

function field(n,us,max){

function simBracket(seeds){
  var n=seeds.length,order=n===8?[0,7,3,4,1,6,2,5]:[0,3,1,2];
  var cur=order.map(function(i){return seeds[i];}),res={us:null,champ:null,runner:null};
  while(cur.length>1){
    var nxt=[];
    for(var i=0;i<cur.length;i+=2){
      var a=cur[i],b=cur[i+1],pw=seriesP(pgame(a.perf,b.perf),5),w=Math.random()<pw?a:b,l=w===a?b:a;
      nxt.push(w);
      if(l.us)res.us=cur.length===8?'qf':cur.length===4?'semi':'final';
      if(cur.length===2)res.runner=l.n;
    }
    cur=nxt;
  }
  res.champ=cur[0].n;if(cur[0].us)res.us='champ';
  return res;
}
/* 인터랙티브 브래킷: 우리 경기만 직접 플레이, 나머지는 자동 */
function runBracket(seeds,opts,done){
  var n=seeds.length,order=n===8?[0,7,3,4,1,6,2,5]:[0,3,1,2];
  var cur=order.map(function(i){return seeds[i];}),res={us:null,champ:null,runner:null};
  var rIdx=0;
  function round(){
    if(cur.length===1){res.champ=cur[0].n;if(cur[0].us)res.us='champ';done(res);return;}
    var pairs=[],i;for(i=0;i<cur.length;i+=2)pairs.push([cur[i],cur[i+1]]);
    var nxt=[],idx=0,len=cur.length,stage=len===8?'8강':len===4?'4강':'결승',st=len===8?'qf':len===4?'semi':'final';
    function step(){
      if(idx>=pairs.length){cur=nxt;round();return;}
      var a=pairs[idx][0],b=pairs[idx][1];idx++;
      if(a.us||b.us){
        var us=a.us?a:b,opp=a.us?b:a;
        startSeries({n:opp.n,perf:opp.perf},5,opts.label+' '+stage,function(win){
          var w=win?us:opp,l=win?opp:us;
          if(!win)res.us=st;
          if(len===2)res.runner=l.n;
          nxt.push(w);step();
        });
      }else{
        var pw=seriesP(pgame(a.perf,b.perf),5),w2=Math.random()<pw?a:b,l2=w2===a?b:a;
        if(len===2)res.runner=l2.n;
        nxt.push(w2);step();
      }
    }
    if(!(opts.gate&&!res.us))rIdx++;
    if(opts.gate&&!res.us){
      var up=pairs.filter(function(p){return p[0].us||p[1].us;})[0];
      if(up){
        var uu=up[0].us?up[0]:up[1],oo=up[0].us?up[1]:up[0],ls=[];
        if(len===8&&opts.note)ls.push(opts.note);
        ls.push('vs '+oo.n+' · 전력 '+tier(oo.perf)+'급 ('+Math.round(oo.perf)+') / 우리 '+tier(uu.perf)+'급 ('+Math.round(uu.perf)+')');
        ls.push('Bo5 · 밴픽부터 직접 플레이해요. (하드 피어리스)');
        var gact=(rIdx>0||opts.firstAct)?1:0;rIdx++;
        gateShow(opts.label+' '+stage,ls,stage+' 시작하기',step,gact);
        return;
      }
    }
    step();
  }
  round();
}
function gatedPair(a,b,label,done,opts){
  if(opts&&opts.gate&&(a.us||b.us)){
    var uu=a.us?a:b,oo=a.us?b:a,stg=label.replace(opts.label+' ',''),gact=(opts.nUser>0)?1:0;
    opts.nUser=(opts.nUser||0)+1;
    gateShow(label,['vs '+oo.n+' · 전력 '+tier(oo.perf)+'급 ('+Math.round(oo.perf)+') / 우리 '+tier(uu.perf)+'급 ('+Math.round(uu.perf)+')','Bo5 · 밴픽부터 직접 플레이해요. (하드 피어리스)'],stg+' 시작하기',function(){playPair(a,b,label,done);},gact);
    return;
  }
  playPair(a,b,label,done);
}
function playPair(a,b,label,done){
  if(a.us||b.us){
    var us=a.us?a:b,opp=a.us?b:a;
    startSeries({n:opp.n,perf:opp.perf},5,label,function(win){done(win?us:opp,win?opp:us);});
  }else{
    var pw=seriesP(pgame(a.perf,b.perf),5),w=Math.random()<pw?a:b;
    done(w,w===a?b:a);
  }
}
/* 6팀 플레이오프: 3·4·5·6위가 1라운드, 1·2위는 준결승 직행 */
function runBracket6(seeds,opts,done){
  var res={us:null,champ:null,runner:null};
  function gp6(a,b,l,d){gatedPair(a,b,l,d,opts);}
  gp6(seeds[2],seeds[5],opts.label+' 1라운드',function(w1,l1){
    if(l1.us)res.us='r1';
    gp6(seeds[3],seeds[4],opts.label+' 1라운드',function(w2,l2){
      if(l2.us)res.us='r1';
      gp6(seeds[0],w2,opts.label+' 준결승',function(s1,sl1){
        if(sl1.us)res.us='semi';
        gp6(seeds[1],w1,opts.label+' 준결승',function(s2,sl2){
          if(sl2.us)res.us='semi';
          gp6(s1,s2,opts.label+' 결승',function(c,r){
            res.champ=c.n;res.runner=r.n;
            if(c.us)res.us='champ';else if(r.us)res.us='final';
            done(res);

        });
      });
    });
  });
}
function simBracket6(seeds){

  return '<div class="sm" style="margin:3px 0">'+esc(x.n)+' <span class="mute">('+RL[x.rl]+' · '+x.age+'세 · 종합 '+x.ovr+')</span><br><span class="mute">'+esc(x.from||'FA')+' → </span>'+esc(x.to)+'</div>';
}
function openMoves(tab,tm){
  var np=G&&G.np;if(!np){return;}
  tab=tab||'mv';
  var tabs=[['mv','이번 이동'],['fa','FA 시장'],['ret','은퇴'],['tm','팀 로스터']];
  var chips='<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:8px">'+tabs.map(function(t){return '<button class="chipb" style="'+(tab===t[0]?'border-color:var(--gold,#d6a93b);color:var(--gold,#d6a93b)':'')+'" onclick="openMoves(\''+t[0]+'\')">'+t[1]+'</button>';}).join('')+'</div>';
  var body='',ev=np.mv[0];
  if(tab==='mv'){
    if(!ev)body='<p class="sm mute">아직 선수 이동이 없어요. 프로 데뷔 후 첫 휴식기부터 계약 만료·FA·이적·은퇴가 일어나요.</p>';
    else{
      body='<p class="sm"><b>시즌 '+ev.sn+' 종료 후</b> · 재계약 '+ev.re+'명 · 이적 '+ev.mv.filter(function(x){return x.t==='이적';}).length+'명 · 은퇴 '+ev.ret.length+'명 · 신인 '+ev.rk.length+'명</p>';
      var tr=ev.mv.filter(function(x){return x.t==='이적';}).sort(function(a,b){return b.ovr-a.ovr;});
      body+='<div class="sm"><b>🔁 주요 이적</b></div>'+(tr.length?tr.slice(0,14).map(mvLine).join(''):'<div class="sm mute">없음</div>');
      var rs=ev.mv.filter(function(x){return x.t==='재계약';}).sort(function(a,b){return b.ovr-a.ovr;});
      if(rs.length)body+='<div class="sm" style="margin-top:8px"><b>✍️ 주요 재계약</b></div>'+rs.slice(0,6).map(function(x){return '<div class="sm" style="margin:3px 0">'+esc(x.n)+' <span class="mute">('+RL[x.rl]+' · '+x.age+'세 · 종합 '+x.ovr+')</span> '+esc(x.to)+'</div>';}).join('');
      if(ev.rk.length)body+='<div class="sm" style="margin-top:8px"><b>🌱 신인 영입</b></div>'+ev.rk.slice(0,10).map(function(x){return '<div class="sm" style="margin:3px 0">'+esc(x.n)+' <span class="mute">('+RL[x.rl]+' · '+x.age+'세)</span> '+esc(x.tm)+'</div>';}).join('');
    }
  }else if(tab==='fa'){
    var fl=np.fa.map(function(id){return np.pl[id];}).filter(function(p){return p;});
    body='<p class="sm mute">계약하지 못한 FA예요. 다음 휴식기에 팀들이 영입을 시도해요.</p>'+(fl.length?fl.map(function(p){return '<div class="sm" style="margin:3px 0">'+esc(p.n)+' <span class="mute">('+RL[p.rl]+' · '+p.age+'세 · 종합 '+Math.round(p.ovr)+(p.prev?' · 전 소속 '+esc(p.prev):'')+')</span></div>';}).join(''):'<div class="sm mute">지금은 미계약 FA가 없어요.</div>');
  }else if(tab==='ret'){
    body='<p class="sm mute">최근 은퇴한 선수예요.</p>'+(np.ret.length?np.ret.slice(0,24).map(function(r){return '<div class="sm" style="margin:3px 0">'+esc(r.n)+' <span class="mute">('+RL[r.rl]+' · '+r.age+'세 · 종합 '+r.ovr+' · '+esc(r.tm)+') · 시즌 '+r.sn+' 종료 후</span></div>';}).join(''):'<div class="sm mute">아직 은퇴한 선수가 없어요.</div>');
  }else{
    var sel=tm||(G.team?G.team.n:WORLD[0].n);
    var rgs=['LCK','LPL','LEC','ETC'];
    body='<div class="row" style="gap:4px;flex-wrap:wrap;margin-bottom:8px">'+WORLD.map(function(t){return '<button class="chipb" style="min-height:26px;padding:0 7px;font-size:11px;'+(t.n===sel?'border-color:var(--gold,#d6a93b);color:var(--gold,#d6a93b)':'')+'" onclick="openMoves(\'tm\',\''+t.n.replace(/\'/g,"\\'")+'\')">'+esc(abbr(t.n))+'</button>';}).join('')+'</div>';
    var tt=WORLD.filter(function(t){return t.n===sel;})[0];
    body+='<div class="sm"><b>'+esc(sel)+'</b> <span class="mute">· 전력 '+(tt?Math.round(tt.r):'-')+' · '+REG[tt?tt.region:'LCK']+'</span></div>';
    ROLE_ORDER.forEach(function(r){
      var p=npcAt(sel,r),me=(G.team&&G.team.n===sel&&r===G.role);
      body+='<div class="sm" style="margin:4px 0">'+RL[r]+' · '+(me?'<b>'+esc(G.name)+'</b> <span class="mute">(나)</span>':(p?esc(p.n)+' <span class="mute">'+p.age+'세 · 종합 '+Math.round(p.ovr)+' · 계약 '+Math.max(p.con,0)+'년'+(me===false&&G.team&&G.team.n===sel&&false?'':'')+(p.vir?' · 가상':'')+'</span>':'-'))+(G.team&&G.team.n===sel&&r===G.role&&p?'<span class="mute"> · 벤치 '+esc(p.n)+'</span>':'')+'</div>';
    });
  }
  showSheet('📰 선수 이동 현황',chips+body,[{t:'닫기',cls:'pri',fn:function(){G.sheet=null;render();}}]);
}
/* 실제 선수 닉네임 로스터 (탑·정글·미드·원딜·서폿) — LCK는 2026 시즌 기준, 해외는 일부 팀만 */
var ROS={
 'T1':['도란','오너','페이커','페이즈','케리아'],
 '젠지':['기인','캐니언','쵸비','룰러','두로'],
 '한화생명':['제우스','카나비','제카','구마유시','딜라이트'],
 '디플러스 기아':['시우','루시드','쇼메이커','스매쉬','커리어'],
 'KT 롤스터':['퍼펙트','커즈','비디디','에이밍','고스트'],
 'BNK 피어엑스':['클리어','랩터','빅라','디아블','켈린'],
 '농심 레드포스':['킹겐','스폰지','스카웃','태윤','리헨즈'],
 '키움 DRX':['리치','빈센조','유칼','지우','앤딜'],
 'DN SOOPers':['두두','표식','클로저','덕담','피터'],
 '한진 브리온':['캐스팅','기디온','피셔','테디','남궁'],
 'BLG':['빈','쉰','나이트','바이퍼','온'],
 'TES':['369','나이요','크림','지아치','펑위에'],
 'AL':['플랑드레','타잔','샹크스','호프','케일'],
 'G2':['브로큰블레이드','스큐몬드','캡스','한스 사마','라브로프'],
 '프나틱':['오스카리닌','라조크','포비','업셋','미키엑스']
};
var ROSALIAS={'광동 프릭스':'DN SOOPers','OK저축은행 브리온':'한진 브리온','DRX':'키움 DRX'};
var COACHN={'T1':'kkOma','젠지':'Ryu','한화생명':'Homme','디플러스 기아':'cvMax','KT 롤스터':'Score','BNK 피어엑스':'Edo','농심 레드포스':'DanDy','키움 DRX':'Joker','DN SOOPers':'oDin','한진 브리온':'SSONG'};
var SPARE={top:['칸','모건'],jg:['엄티','윌러'],mid:['페이트','쿠리'],adc:['엘크','프린스'],sup:['메이코','베릴']};
function rosKey(n){var b=String(n).replace(/ [23]군$/,'');return ROSALIAS[b]||b;}
function rosNick(team,role){
  if(!team||/ [23]군$/.test(String(team)))return null;
  var p=(G&&G.np)?npcAt(rosKey(team),role):null;
  if(p&&G&&p.n!==G.name)return p.n;
  var r=ROS[rosKey(team)],n=r&&r[ROLE_ORDER.indexOf(role)];
  if(!n||(G&&n===G.name))return null;
  return G&&G.np?null:n;
}
function allRosNicks(){var o={};for(var k in ROS)ROS[k].forEach(function(n){o[n]=1;});return o;}
function freeNick(role){
  var used=allRosNicks(),cur={};
  if(G&&G.roster)ROLE_ORDER.forEach(function(r){if(G.roster[r])cur[G.roster[r].n]=1;});
  var pool=SPARE[role].concat(REAL.filter(function(x){return x.role===role;}).map(function(x){return x.id;})).filter(function(n){return !used[n]&&!cur[n]&&!(G&&n===G.name);});
  return pool.length?pick(pool):rname();
}
function oppLbl(role){var n=M&&M.opp?rosNick(M.opp.n,role):null;return n?('상대 '+n+'('+RL[role]+')'):('상대 '+RL[role]);}
function makeRoster(){
  G.roster={};
  if(!G.np)G.np=npcInit();
  ROLE_ORDER.forEach(function(r){if(r===G.role)return;var p=npcAt(G.team.n,r);G.roster[r]={n:p?p.n:rname(),o:Math.round(p?p.ovr:G.team.r),age:p?p.age:null};});
  G.syn=ri(35,55);G.coach={n:COACHN[rosKey(G.team.n)]||rname(),q:Math.round(cl(G.team.r+gauss()*5,55,95))};
}
function rosterTurnover(){syncRoster();}
function retireCheck(next){
  if(G.age<31){next();return;}
  var p=Math.min(.95,(G.age-30)*.13+(ovr()<72?.1:0));
  var forced=G.age>=38;
  if(forced||Math.random()<p){
    var why=pick(['손목 통증이 잦아지고, 후배들의 반응 속도가 눈에 띄게 빨라졌어요.','예전 같은 집중력을 유지하기가 어려워졌어요.','가족과 함께하는 시간이 점점 더 소중해졌어요.','이제는 지도자의 길을 생각해 볼 때가 된 것 같아요.']);
    var btns=[{t:'은퇴를 선언한다',cls:'pri',fn:function(){retire('age');}}];
    if(!forced)btns.push({t:'한 해 더 뛴다',cls:'ghost',fn:function(){G.sheet=null;addLog(G.age+'세, 은퇴를 미루고 한 해 더 뛰기로 했다.');next();}});
    showSheet('🍂 은퇴를 고민할 시기','<p>'+G.age+'세. '+why+'</p>'+(forced?'<p class="sm mute">더 이상 계약을 제안하는 팀이 없어요.</p>':'<p class="sm mute">한 해 더 뛰면 점수를 더 쌓을 수 있지만, 기량은 계속 떨어질 수 있어요.</p>'),btns);
    return;
  }
  next();
}
function afterYear(){
  retireCheck(function(){
    if(G.contract<=0){proOffers();return;}
    render();
  });
}
function yearEnd(){
  G.q=0;G.offN=null;G.endStreak=0;G.age++;G.chem*=.5;G.lessonsYr=0;G.counselYr=0;G.campYr=0;G.fans=cl(G.fans-1,0,100);G.slump=0;
  if(G.pro){ensureG();npcYear();}
  updateWorld();
  if(G.age>=26)decline();
  if(G.pro){
    G.contract--;G.c.years++;G.yr={};G.money+=G.salary;G.fatigue=Math.max(0,G.fatigue-25);
    rosterTurnover();
    afterYear();return;
  }
  if(G.age>=17){debutOffers();return;}
  render();
}

/* ============ 프로 시즌 ============ */
function seq(list,done){
  if(!list.length){done();return;}
  var it=list[0];
  showSheet(it.title,it.body.map(function(l){return '<p>'+esc(l)+'</p>';}).join(''),[{t:it.btn||'계속',cls:'pri',fn:function(){G.sheet=null;seq(list.slice(1),done);}}]);
}
function endSeason(){G.slump=0;maybeEvent(finishTurn);}
function runSeason(){
  if(G.q===1||G.q===2)runSplit(G.q);else runWorlds();
}
function standings(S,final){
  var tot=S.sched.length,f=final?1:(tot?S.gp/tot:0);
  return S.ts.map(function(t){return {n:t.n,us:t.us,perf:t.perf,tb:t.tb,w:t.us?S.w:Math.round(t.aiW*f)+(t.beatUs||0)};}).sort(function(a,b){return b.w-a.w||b.tb-a.tb;});
}
function runSplit(q){
  newMeta();
  var lab=q===1?'스프링':'서머',rg=G.team.region;
  var teams=WORLD.filter(function(t){return t.region===rg;});
  var ts=teams.map(function(t){return {n:t.n,us:t===G.team,perf:t===G.team?0:t.r+buff(t.region)+gauss()*4.5,aiW:0,beatUs:0,tb:Math.random()};});
  var i,j,g;
  for(i=0;i<ts.length;i++)for(j=i+1;j<ts.length;j++){if(ts[i].us||ts[j].us)continue;for(g=0;g<2;g++){if(Math.random()<pgame(ts[i].perf,ts[j].perf))ts[i].aiW++;else ts[j].aiW++;}}
  var opps=ts.filter(function(t){return !t.us;});
  function shuf(a){return a.slice().sort(function(){return Math.random()-.5;});}
  var first=shuf(opps),second=shuf(opps);
  if(second.length>1&&second[0]===first[first.length-1]){var tmp=second[0];second[0]=second[1];second[1]=tmp;}
  var sched=first.concat(second),n=sched.length;
  G.sp={q:q,lab:lab,rg:rg,ts:ts,sched:sched,i:0,w:0,l:0,gp:0,mode:'full',scout:0,streak:0};
  G.sp.mode=G.smode||'full';G.sp.pts=0;
  render();
}
function showNotice(){
  var S=G.sp;if(!S)return;
  if(S.i>=S.sched.length){finishRegular();return;}
  render();
}
function spGo(skip){
  var S=G.sp;if(!S||G.sheet||M)return;
  if(S.i>=S.sched.length){finishRegular();return;}
  autoUsePts();
  if(G.sheet||M||G.sp!==S)return;
  playNext(skip);
}
function spAllAsk(){
  var S=G.sp;if(!S||G.sheet||M)return;
  var left=S.sched.length-S.i;
  showSheet('정규리그 결과 보기','<p>남은 '+left+'경기를 자동으로 진행하고 최종 순위를 확인해요.</p><p class="sm mute">훈련은 추천 활동으로 자동 선택돼요.</p>',[{t:'결과 보기',cls:'pri',fn:function(){G.sheet=null;autoUsePts();if(G.sp)autoRest();}},{t:'취소',cls:'ghost',fn:function(){G.sheet=null;render();}}]);
}
function setSMode(m){G.smode=m;if(G.sp)G.sp.mode=m;render();}
function matchAct(a){
  var S=G.sp,A=ACT[a],before={};
  STATS.forEach(function(k){before[k]=G.s[k];});
  var inj=false;
  if(a==='fb'){
    S.scout=1;
    var wk=STATS.slice().sort(function(x,y){return G.s[x]-G.s[y];})[0];
    G.s[wk]=Math.min(99,G.s[wk]+.08*growth(G.age)*G.pot);
  }else{trainApply(a,'inter');inj=checkInj(a,.4);}
  G.d={};STATS.forEach(function(k){G.d[k]=G.s[k]-before[k];});
  G.last=S.lab+' '+(S.i+1)+'경기 전 · '+A.n+(inj?' · ⚠️ 손목 부상':'');
  G.peak=Math.max(G.peak,ovr());
  S.pts=Math.max(0,(S.pts||0)-1);
  if(S.pts>0)render();else showNotice();
}
function recordMatch(opp,win){
  var S=G.sp;S.gp++;S.streak=S.streak||0;
  if(win){S.w++;S.streak=S.streak>0?S.streak+1:1;if(S.streak===5||S.streak===8){news(G.team.n+' '+S.streak+'연승! '+G.name+' 맹활약','win');if(S.streak===5&&Math.random()<.5)awaken('5연승');}}
  else{S.l++;opp.beatUs=(opp.beatUs||0)+1;S.streak=S.streak<0?S.streak-1:-1;if(S.streak===-3){news(G.team.n+' 3연패… '+G.name+' 부진 논란','lose');slumpStart('3연패');}}
}
function playNext(skip){
  var S=G.sp,opp=S.sched[S.i],sc=S.scout;S.scout=0;G.flash=null;
  if(S.mode==='sim'||skip){
    var win=Math.random()<pgame(ourPerf()+gauss()*2.5+(sc?1:0),opp.perf);
    G.fatigue=cl(G.fatigue+1,0,100);recordMatch(opp,win);S.i++;
    showSheet('경기 결과','<p>vs '+esc(opp.n)+' — <b>'+(win?'승리':'패배')+'</b></p>'+synthGame(win,opp,true).html+'<p class="sm mute">현재 '+S.w+'승 '+S.l+'패</p>',[{t:'계속',cls:'pri',fn:function(){G.sheet=null;afterMatch(win);}}]);
    return;
  }
  startSeries({n:opp.n,perf:opp.perf,sig:opp.sig},1,S.lab+' 정규시즌 '+(S.i+1)+'경기 · vs '+opp.n,function(w){recordMatch(opp,w);S.i++;afterMatch(w);},S.mode,sc);
}
function afterMatch(win){
  var S=G.sp;if(!S)return;
  if(S.i>=S.sched.length){finishRegular();return;}
  S.pts=1;
  render();
}
function autoRest(){
  var S=G.sp;if(!S||G.sheet||M)return;
  while(S.i<S.sched.length){
    var opp=S.sched[S.i],win=Math.random()<pgame(ourPerf()+gauss()*2.5,opp.perf);
    G.fatigue=cl(G.fatigue+1,0,100);recordMatch(opp,win);S.i++;
    for(var pj=1;pj>0;pj--){var a=recAct();trainApply(a,'inter');checkInj(a,.4);}
    G.peak=Math.max(G.peak,ovr());
  }
  finishRegular();
}
function finishRegular(){
  var S=G.sp;G.endStreak=S.streak||0;G.sp=null;
  var st=standings(S,true),ui=0;st.forEach(function(t,i){if(t.us)ui=i;});
  var usPerf=ourPerf()+gauss()*3;
  var r={ts:st.map(function(t){return {n:t.n,us:t.us,perf:t.us?usPerf:t.perf,w:t.w};}),rank:ui+1,w:S.w,g:S.sched.length};
  afterRegular(S.q,S.lab,S.rg,r);
}
function afterRegular(q,lab,rg,r){
  var ovv=ovr();
  var lines=['정규시즌 '+r.rank+'위 ('+r.w+'승 '+(r.g-r.w)+'패)'];
  if(r.rank<=3){
    var p=r.rank===1?.4:r.rank===2?.22:.1;p+=cl((ovv-75)/80,0,.25);
    if(Math.random()<p){G.c.rsmvp++;lines.push('🏅 정규시즌 MVP 선정!');G.fans=cl(G.fans+2,0,100);addLog(lab+' 정규시즌 MVP');news(lab+' 정규시즌 MVP는 '+G.name+'!','win');}
  }
  var NB=r.ts.length>=8?6:4;
  var seeds=r.ts.slice(0,NB).map(function(t){return {n:t.n,perf:t.perf,us:t.us};});
  function after(po){
    var ln=[],abroad=rg!=='LCK';
    if(po.us==='miss'){ln.push('플레이오프 진출 실패');G.fans=cl(G.fans-1,0,100);}
    else if(po.us==='champ'){
      G.c.league++;if(abroad)G.c.abroad++;
      ln.push('🏆 '+REG[rg]+' '+lab+' 우승!');
      if(Math.random()<cl(.3+(ovv-80)/45,.1,.8)){G.c.lfmvp++;ln.push('🌟 파이널 MVP');}
      G.fans=cl(G.fans+4,0,100);G.tro.push({a:G.age,t:REG[rg]+' '+lab+' 우승'});addLog(lab+' 우승!');
    }else if(po.us==='final'){G.c.leagueF++;ln.push('결승에서 '+po.champ+'에게 패배 (준우승)');G.fans=cl(G.fans+2,0,100);addLog(lab+' 준우승');}
    else if(po.us==='r1')ln.push('1라운드에서 탈락 (5~6위)');
    else ln.push('준결승에서 탈락 (3~4위)');
    if(po.us==='champ'){news(REG[rg]+' '+lab+' 우승! '+G.team.n+' 정상 등극','win');if(Math.random()<.6)awaken('리그 우승');}
    else if(po.us==='final')news(lab+' 결승에서 석패… '+G.team.n+' 준우승','lose');

function msiFlow(po,next){

  }
  function bracket2(){
    var seeds=[us].concat(others).sort(function(a,b){return b.perf-a.perf;});

      news(m.us==='champ'?'MSI 우승! '+G.team.n+' 세계 정상 등극':m.us==='final'?'MSI 결승 패배… '+G.team.n+' 준우승':'MSI '+(m.us==='semi'?'4강':'8강')+' 탈락',m.us==='champ'?'win':'lose');
      seq([{title:'MSI 결과',body:ml}],next);
    });
  }
  if(po.us==='champ'){
    showSheet('🌏 MSI 본선 직행','<p>리그 우승 자격으로 본선에 직행했어요.</p><p class="sm mute">본선부터는 밴픽부터 직접 플레이해요.</p>',[{t:'출국 준비하기',cls:'pri',fn:function(){G.sheet=null;bracket();}}]);

    if(win){
      showSheet('🌏 MSI 예선 (자동 진행)','<p>예선에서 '+esc(opp.n)+'을(를) 꺾고 본선에 올랐어요!</p><p class="sm mute">본선부터는 밴픽부터 직접 플레이해요.</p>',[{t:'출국 준비하기',cls:'pri',fn:function(){G.sheet=null;bracket();}}]);
    }else{
      seq([{title:'🌏 MSI 예선 (자동 진행)',body:['예선에서 '+opp.n+'에게 패해 본선 진출에 실패했어요.']}],next);
    }
  }

function preAct(a){

    '우리 전력 '+tier(us.perf)+'급 ('+Math.round(us.perf)+')'],'스위스 스테이지 시작하기',function(){

function lvP(op,spec){

  add('리그 우승 ×'+c.league,c.league*20);

  add('트리플 크라운 ×'+c.triple,c.triple*60);
  add('골든 로드 ×'+c.golden,c.golden*100);
  add('최고 능력치 '+Math.round(G.peak),Math.max(0,G.peak-70)*3);

  h+='<div class="card"><div class="row" style="align-items:flex-start;gap:12px">'+boardCol('우리 팀',D.bansUs,D.us,(function(){var o={};ROLE_ORDER.forEach(function(r){o[r]=r===G.role?G.name:(G.roster&&G.roster[r]?G.roster[r].n:'');});return o;})())+boardCol(esc(M.opp.n),D.bansOpp,D.opp,(function(){var o={};ROLE_ORDER.forEach(function(r){o[r]=rosNick(M.opp.n,r)||'';});return o;})())+'</div></div>';
  if(done)return h;
  var isBan=st.t==='ban',cnt=isBan?D.bansUs.length+1:Object.keys(D.us).length+1;
  h+='<div class="card"><div class="row sp"><b>'+(isBan?'🚫 우리 밴 차례':'✅ 우리 픽 차례')+'</b><span class="sm mute">'+cnt+' / 5 · 전체 '+(D.step+1)+' / 20</span></div>';
  h+='<div class="sm mute" style="margin:4px 0">상대 주력: '+ROLE_ORDER.map(function(r){return RL[r]+' '+esc(M.opp.sig[r][0]);}).join(' · ')+'</div>';
  var tabs=isBan?['rec'].concat(ROLE_ORDER):ROLE_ORDER.filter(function(r){return !D.us[r];});
  h+='<div class="chips" style="margin:8px 0">'+tabs.map(function(t){return '<button class="chipb '+(D.tab===t?'sel':'')+'" onclick="dTab(\''+t+'\')">'+(t==='rec'?'추천':RL[t])+'</button>';}).join('')+'</div>';
  if(D.sel){
    var c=CHM[D.sel],tg=c.tags.split('').map(function(x){return TAGL[x];}).join('·'),info;
    if(isBan){var sg=M.opp.sig[c.role];info=(sg&&sg.indexOf(c.n)>=0?'⚠️ 상대 주력 챔피언 · ':'')+'메타 '+ctier(c)+' · '+tg;}
    else{
      var mp={};ROLE_ORDER.forEach(function(r){if(D.us[r])mp[r]=D.us[r];});mp[(ROLE_ORDER.indexOf(D.tab)>=0&&canRole(c,D.tab))?D.tab:c.role]=c.n;
      var ev=evalComp(mp),oc=D.opp[D.tab],laneTxt=(oc&&CHM[oc])?'<br>라인 상성 vs '+esc(oc)+': '+(function(v){return v>1?'우세':v<-1?'불리':'비슷';})(laneVs(c,CHM[oc]))+(ctrVal(c.n,oc)!==0?' (카운터)':''):'',synTxt=(function(){var l=synListFor(c.n,D.us);return l.length?'<br>✨ 시너지: '+esc(l.join(', '))+'와(과) 호흡이 좋아요':'';})();
      info='메타 '+ctier(c)+' · '+tg+(c.role===G.role?' · 내 숙련도 '+Math.round(comfort(c.n)):'')+'<br>조합 → '+esc(ev.notes.join(' · ')||'무난')+laneTxt+synTxt;
    }
    h+='<div class="card gold" style="margin:6px 0"><div class="row sp"><b>'+esc(c.n)+' <span class="mute sm">'+RL[c.role]+'</span></b></div><div class="sm" style="margin:4px 0 8px">'+info+'</div><button class="btn pri" onclick="dConfirm()">'+(isBan?'밴 확정':'픽 확정')+'</button></div>';
  }
  var list;
  if(D.tab==='rec'&&isBan){
    list=CH.filter(availBan).map(function(c){var sg=M.opp.sig[c.role],s=cv(c)+(sg&&sg.indexOf(c.n)>=0?12:0);return {c:c,s:s};}).sort(function(a,b){return b.s-a.s;}).slice(0,12).map(function(x){return x.c;});
  }else{
    list=CH.filter(function(c){return canRole(c,D.tab);}).sort(function(a,b){return cv(b)-cv(a);});
  }
  h+='<div class="cgrid">';
  list.forEach(function(c){
    var ok=isBan?availBan(c):avail(c,'us'),sg=M.opp.sig[c.role],sig=sg&&sg.indexOf(c.n)>=0;
    var sy=(!isBan&&synBonus(c.n,D.us)>0)?'<em>✨ 시너지</em>':'';
    var sub=(!isBan&&D.tab===G.role)?'<em>숙련 '+Math.round(comfort(c.n))+'</em>':(isBan&&sig?'<em>⚠️ 주력</em>':(!isBan&&c.role!==D.tab?'<em>겸 포지션</em>':''));
    if(sy)sub=sy;
    h+='<button class="ct'+(D.sel===c.n?' sel':'')+(ok?'':' off')+'" onclick="dSel(\''+esc(c.n)+'\')">'+champIcon(c.n)+'<i class="t'+ctier(c)+'">'+ctier(c)+'</i><span>'+esc(c.n)+'</span>'+sub+'</button>';
  });
  h+='</div>';
  h+='<button class="btn ghost" style="margin-top:10px" onclick="dAuto()">🤖 AI 추천으로 남은 밴픽 자동 진행</button></div>';
  h+='<details class="card"><summary>용어 설명</summary><div class="sm" style="line-height:1.7"><b>이니시</b> 돌진·군중제어로 교전을 여는 능력<br><b>포킹</b> 원거리 견제로 체력을 깎는 능력<br><b>픽(끊기)</b> 상대 한 명을 끊어서 잡아내는 능력 (위험한 한타 전에 인원 하나를 먼저 제거)<br><b>후반</b> 시간이 지날수록 강해지는 스케일링<br><b>초반</b> 초반 주도권과 라인전이 강함<br><b>탱커</b> 앞라인에서 버티는 단단한 챔피언<br><b>AD/AP 편중</b> 같은 피해 유형이 너무 많아 상대가 방어 아이템으로 대응하기 쉬움<br><b>이니시/프론트라인 부족</b> 교전을 열거나 앞에서 버틸 챔피언이 없음</div></details>';
  return h;
}
function endHTML(){
  var sc=calcScore(),t=titleOf(sc.total),h='';
  var why={age:G.age+'세, 정든 무대를 떠납니다.',self:'스스로 은퇴를 선언했어요.',unknown:'프로팀의 부름을 끝내 받지 못했어요.'}[G.reason]||'';
  var scn=G.c.worlds>0?sceneStage(true):(G.pro?sceneHouse(tcol(G.team.n)):scenePC());
  h+='<div style="padding-top:10px">'+scn+'</div>';
  h+='<div style="text-align:center"><div class="row" style="justify-content:center;margin-bottom:8px">'+faceSVG(G.face,{age:G.age,stars:G.c.worlds,jersey:G.pro&&G.team?tcol(G.team.n):'#5a6270',headset:false,accent:'#e05a3c'},'lg')+'</div><div style="font-size:36px">'+t[1]+'</div><h1 class="disp" style="font-size:44px;color:var(--gold)">'+t[0]+'</h1><div class="mute">'+t[2]+'</div></div>';
  h+='<div class="card gold" style="text-align:center;margin-top:14px"><div class="big" style="font-size:34px">'+sc.total+'</div><div class="sm mute" style="margin-top:6px">최종 점수</div><div style="margin-top:6px">'+esc(G.name)+' · '+ROLES[G.role].n+(G.real?' · 실존 선수 모드':'')+'</div><div class="sm mute">'+why+'</div></div>';
  h+='<div class="card"><b>커리어 요약</b>'
   +'<div class="ln"><span>월드 챔피언십 우승</span><b>'+G.c.worlds+'회</b></div>'
   +'<div class="ln"><span>MSI 우승</span><b>'+G.c.msi+'회</b></div>'
   +'<div class="ln"><span>리그 우승</span><b>'+G.c.league+'회</b></div>'
   +'<div class="ln"><span>프로 데뷔</span><b>'+(G.debutAge?G.debutAge+'세':'없음')+'</b></div>'
   +'<div class="ln"><span>프로 경력</span><b>'+G.c.years+'년</b></div>'
   +'<div class="ln"><span>최고 종합 능력치</span><b>'+Math.round(G.peak)+'</b></div>'
   +'<div class="ln"><span>누적 수입</span><b>'+Math.round(G.money*10)/10+'억</b></div>'
   +(G.post?'<div class="ln"><span>은퇴 후 진로</span><b>'+esc(G.post.n)+'</b></div>':'')
   +(G.prospect?'<div class="ln"><span>출신</span><b>🌟 유망주</b></div>':'')
   +'<div class="ln"><span>시그니처 챔피언</span><b>'+topChamps(5).map(esc).join(', ')+'</b></div></div>';
  if(sc.items.length)h+='<div class="card"><b>점수 내역</b>'+sc.items.map(function(x){return '<div class="ln"><span>'+esc(x[0])+'</span><b>'+x[1]+'</b></div>';}).join('')+'</div>';
  if(G.tro.length)h+='<div class="card"><b>트로피</b>'+G.tro.map(function(x){return '<div class="ln"><span>'+esc(x.t)+'</span><span class="mute">'+x.a+'세</span></div>';}).join('')+'</div>';
  h+='<button class="btn pri" onclick="copyShare()">결과 복사하기</button>';
  h+='<button class="btn" style="margin-top:8px;text-align:center" onclick="G=null;SET.screen=\'setup\';render()">새 선수로 다시 도전</button>';
  return h;
}
render();
</script>
